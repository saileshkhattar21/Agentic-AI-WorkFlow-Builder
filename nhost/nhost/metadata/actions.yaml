actions:
  - name: approveStep
    definition:
      kind: synchronous
      handler: https://teclrxnympfptmrgiqfm.functions.ap-south-1.nhost.run/v1/approveStep
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: NHOST_ADMIN_SECRET
    permissions:
      - role: user
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: https://teclrxnympfptmrgiqfm.functions.ap-south-1.nhost.run/v1/triggerWorkflowRun
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: NHOST_ADMIN_SECRET
    permissions:
      - role: user
  - name: triggerWorkflowWebhook
    definition:
      kind: synchronous
      handler: https://teclrxnympfptmrgiqfm.functions.ap-south-1.nhost.run/v1/webhookTrigger
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: NHOST_ADMIN_SECRET
    permissions:
      - role: public
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
  scalars: []
